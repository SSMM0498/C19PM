name: covid19_progression_modeler
description: COVID19 Progression Modeler for Senegalese scientist

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # svg parse to path
  xml: ^4.1.0
  path_parsing: ^0.1.3
  # make canvas clickable
  touchable: ^0.2.0
  simple_animations: ^1.3.3
  date_picker_timeline: ^1.2.3
  bitsdojo_window: ^0.1.0
  fl_chart: ^0.30.0
  path_provider: ^2.0.1
  process_run: ^0.12.1
  arrow_path: ^1.0.0
  starflut: ^1.0.0
  mysql1: ^0.17.1
  flutter_redux: ^0.8.2
  msix: ^1.0.3
  window_size:
    git:
      url: git://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size
  intl: ^0.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - starfiles/

msix_config:
  display_name: C19PM
  publisher_display_name: DeadEnd
  identity_name: DeadEnd.EP.C19PM
  msix_version: 1.0.0.0
  icons_background_color: transparent
  architecture: x64
