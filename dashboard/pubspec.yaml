name: covid19_progression_modeler
description: COVID19 Progression Modeler for Senegalese scientist

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  # svg parse to path
  xml: ^4.1.0
  path_parsing: ^0.1.3
  # make canvas clickable
  touchable: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/senegal.svg
