name: covid19_progression_modeler
description: COVID19 Progression Modeler for Senegalese scientist

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  # svg parse to path
  xml: ^4.1.0
  path_parsing: ^0.1.3
  # make canvas clickable
  touchable: ^0.2.0
  simple_animations: ^1.3.3
  date_picker_timeline: ^1.2.3
  bitsdojo_window: ^0.1.0
  fl_chart: ^0.30.0
  path_provider: ^2.0.1
  window_size:
    git:
      url: git://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/senegal.svg
    - assets/regions/dakar.svg
    - assets/regions/diourbel.svg
    - assets/regions/fatick.svg
    - assets/regions/kedougou.svg
    - assets/regions/kaffrine.svg
    - assets/regions/kaolack.svg
    - assets/regions/kolda.svg
    - assets/regions/louga.svg
    - assets/regions/matam.svg
    - assets/regions/sedhiou.svg
    - assets/regions/saintlouis.svg
    - assets/regions/tambacounda.svg
    - assets/regions/thies.svg
    - assets/regions/ziguinchor.svg
